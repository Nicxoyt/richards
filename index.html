
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
          maximum-scale=1.0, user-scalable=no,
          viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable"
          content="yes">

    <title>Five Nights at Richard</title>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: black;
        }

        /* CONTENEDOR DEL JUEGO */

        #gm4html5_div_id {
            position: absolute !important;

            left: 50% !important;
            top: 50% !important;

            width: 1366px !important;
            height: 768px !important;

            margin: 0 !important;
            padding: 0 !important;

            transform-origin: center center !important;

            transform:
                translate(-50%, -50%)
                scale(var(--escala, 1))
                !important;
        }

        /* CANVAS ORIGINAL DE GAMEMAKER */

        #canvas {
            display: block !important;
            position: relative !important;

            left: 0 !important;
            top: 0 !important;

            width: 1366px !important;
            height: 768px !important;

            margin: 0 !important;
            padding: 0 !important;
        }
    </style>

    <script>
        function ajustarJuego() {

            const ancho = window.innerWidth;
            const alto = window.innerHeight;

            // Mantener proporciones 1366 x 768
            const escala = Math.min(
                ancho / 1366,
                alto / 768
            );

            document.documentElement.style.setProperty(
                "--escala",
                escala
            );
        }

        window.addEventListener(
            "resize",
            ajustarJuego
        );

        window.addEventListener(
            "orientationchange",
            function () {
                setTimeout(ajustarJuego, 150);
            }
        );

        document.addEventListener(
            "DOMContentLoaded",
            ajustarJuego
        );
    </script>

</head>

<body>

    <div class="gm4html5_div_class"
         id="gm4html5_div_id">

        <canvas id="canvas"
                width="1366"
                height="768">
        </canvas>

    </div>

    <!-- ARCHIVO ORIGINAL DEL JUEGO -->

    <script
        src="html5game/five nights at richard.js?cachebust=1825028753">
    </script>

    <script>
        window.onload = function () {

            ajustarJuego();

            GameMaker_Init();

            ajustarJuego();
        };
    </script>

</body>
</html>
